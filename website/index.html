<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MatchCut / 速对齐 - 零渲染、秒级多机位音频同步神器</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 font-sans min-h-screen flex flex-col items-center justify-between selection:bg-indigo-500 selection:text-white">
    <header class="w-full max-w-5xl px-6 py-6 flex items-center justify-between">
        <div class="flex items-center gap-3">
            <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-indigo-500 to-purple-600 flex items-center justify-center shadow-lg shadow-indigo-500/30">
                <svg class="w-6 h-6 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z" /><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>
            </div>
            <span class="text-lg font-black tracking-wide bg-clip-text text-transparent bg-gradient-to-r from-indigo-400 to-purple-400">MatchCut 速对齐</span>
        </div>
        <div class="flex items-center gap-4">
            <select id="langSwitch" onchange="changeLanguage(this.value)" class="bg-slate-900 border border-slate-800 text-slate-300 text-xs rounded-lg px-2.5 py-1.5 focus:outline-none focus:border-indigo-500 cursor-pointer">
                <option value="zh">🇨🇳 中文</option>
                <option value="en">🇬🇧 English</option>
                <option value="es">🇪🇸 Español</option>
                <option value="de">🇩🇪 Deutsch</option>
            </select>
            <a href="https://github.com/Joe651616165/MatchCut" target="_blank" class="text-sm font-semibold text-slate-400 hover:text-white transition-colors" data-i18n="github">GitHub 开源</a>
        </div>
    </header>
    <main class="w-full max-w-4xl px-6 py-12 flex flex-col items-center text-center my-auto">
        <div class="inline-flex items-center gap-2 px-4 py-1.5 rounded-full bg-indigo-500/10 border border-indigo-500/20 text-indigo-300 text-xs font-bold mb-8 shadow-inner">
            <span data-i18n="badge">✨ 全新多机位智能拍摄时间排序已上线</span>
        </div>
        <h1 class="text-4xl md:text-6xl font-black tracking-tight mb-6 leading-tight">
            <span data-i18n="title1">零渲染、秒级多机位</span><br>
            <span class="text-transparent bg-clip-text bg-gradient-to-r from-indigo-400 via-purple-400 to-pink-400" data-i18n="title2">音频同步神器</span>
        </h1>
        <p class="text-base md:text-lg text-slate-400 max-w-2xl mb-10 leading-relaxed" data-i18n="desc">
            告别传统剪辑软件繁琐的对齐与卡顿。直接拖入素材，一键直出剪映草稿及达芬奇 FCPXML，让你的后期效率实现指数级跃升。
        </p>
        <div class="flex flex-col sm:flex-row gap-4 w-full justify-center">
            <a href="https://pan.quark.cn/s/de11501d65ac" target="_blank" class="group relative px-8 py-4 rounded-2xl bg-gradient-to-r from-indigo-600 to-purple-600 hover:from-indigo-500 hover:to-purple-500 text-white font-bold text-lg shadow-[0_0_40px_rgba(99,102,241,0.5)] transition-all hover:scale-105 flex items-center justify-center gap-3">
                <svg class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4" /></svg>
                <span data-i18n="btnChina">国内网盘下载 (推荐大陆用户)</span>
            </a>
            <a href="https://github.com/Joe651616165/MatchCut/releases" target="_blank" class="px-8 py-4 rounded-2xl bg-white/5 hover:bg-white/10 border border-white/10 text-slate-200 font-semibold text-lg transition-all flex items-center justify-center gap-2">
                <span data-i18n="btnGlobal">GitHub Releases (Global)</span>
            </a>
        </div>
        <p class="text-xs text-slate-500 mt-4" data-i18n="support">支持 macOS (Apple Silicon / Intel) & Windows</p>
    </main>
    <footer class="w-full max-w-5xl px-6 py-8 border-t border-white/5 flex flex-col sm:flex-row items-center justify-between text-xs text-slate-500">
        <p data-i18n="footer1">© 2026 MatchCut. Open source under MIT License.</p>
        <p class="mt-2 sm:mt-0" data-i18n="footer2">本地沙盒运行，绝不上传您的隐私素材。</p>
    </footer>
    <script>
        const translations = {
            zh: { github: "GitHub 开源", badge: "✨ 全新多机位智能拍摄时间排序已上线", title1: "零渲染、秒级多机位", title2: "音频同步神器", desc: "告别传统剪辑软件繁琐的对齐与卡顿。直接拖入素材，一键直出剪映草稿及达芬奇 FCPXML，让你的后期效率实现指数级跃升。", btnChina: "国内网盘下载 (推荐大陆用户)", btnGlobal: "GitHub Releases (海外/全球)", support: "支持 macOS (Apple Silicon / Intel) & Windows", footer1: "© 2026 MatchCut. Open source under MIT License.", footer2: "本地沙盒运行，绝不上传您的隐私素材。" },
            en: { github: "GitHub Source", badge: "✨ New multi-camera smart timestamp sorting is live", title1: "Zero-Render, Lightning-Fast", title2: "Multi-Camera Audio Sync", desc: "Say goodbye to tedious alignment and lagging in traditional editors. Drop your footage and export Jianying drafts or DaVinci FCPXML instantly.", btnChina: "China Cloud Drive (For Mainland Users)", btnGlobal: "GitHub Releases (Global)", support: "Supports macOS (Apple Silicon / Intel) & Windows", footer1: "© 2026 MatchCut. Open source under MIT License.", footer2: "Runs locally in a sandbox. Your privacy is 100% protected." },
            es: { github: "GitHub Open Source", badge: "✨ Nueva ordenación inteligente multicámara disponible", title1: "Sincronización de audio multicámara", title2: "sin renderizado y ultrarrápida", desc: "Dile adiós a las alineaciones tediosas. Arrastra tus archivos y exporta borradores de CapCut o DaVinci FCPXML al instante.", btnChina: "Descarga Cloud (Para China Continental)", btnGlobal: "GitHub Releases (Global)", support: "Compatible con macOS (Apple Silicon / Intel) y Windows", footer1: "© 2026 MatchCut. Licencia MIT.", footer2: "Ejecución local en sandbox. Sus datos de privacidad están seguros." },
            de: { github: "GitHub Open Source", badge: "✨ Neues intelligente Multi-Kamera-Sortierung ist da", title1: "Null-Render, Blitzschnelle", title2: "Multi-Kamera Audio-Synchronisation", desc: "Verabschieden Sie sich von mühsamem Ausrichten. Material per Drag & Drop einfügen und sofort CapCut-Entwürfe oder DaVinci FCPXML exportieren.", btnChina: "China Cloud-Download (Für Festland-China)", btnGlobal: "GitHub Releases (Global)", support: "Unterstützt macOS (Apple Silicon / Intel) & Windows", footer1: "© 2026 MatchCut. Unter MIT-Lizenz open source.", footer2: "Lokale Sandbox-Ausführung. Ihre Privatsphäre ist geschützt." }
        };
        function changeLanguage(lang) {
            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                if (translations[lang]?.[key]) el.textContent = translations[lang][key];
            });
            localStorage.setItem('matchcut_lang', lang);
        }
        window.addEventListener('DOMContentLoaded', () => {
            let lang = localStorage.getItem('matchcut_lang') || ((navigator.language || 'zh').toLowerCase().startsWith('es') ? 'es' : (navigator.language || 'zh').toLowerCase().startsWith('de') ? 'de' : (navigator.language || 'zh').toLowerCase().startsWith('en') ? 'en' : 'zh');
            document.getElementById('langSwitch').value = lang;
            changeLanguage(lang);
        });
    </script>
</body>
</html>
